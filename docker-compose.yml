version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: multi-agent-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: multi-agent-assistant
    volumes:
      - mongodb_data:/data/db
    networks:
      - multi-agent-network

  redis:
    image: redis:7-alpine
    container_name: multi-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - multi-agent-network

volumes:
  mongodb_data:
  redis_data:

networks:
  multi-agent-network:
    driver: bridge

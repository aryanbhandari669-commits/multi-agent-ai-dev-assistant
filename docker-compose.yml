version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai-dev-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-dev-assistant
    networks:
      - ai-dev-network

  redis:
    image: redis:7-alpine
    container_name: ai-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-dev-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-dev-server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai-dev-assistant
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID}
      LOG_LEVEL: info
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - ai-dev-network
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai-dev-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_SOCKET_URL: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - ai-dev-network
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  ai-dev-network:
    driver: bridge
